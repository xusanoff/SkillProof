# Judge0 settings shared by judge0-server and judge0-workers. Passwords come from the environment.
REDIS_HOST=judge0-redis
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
# isolate cannot use cgroups on cgroup v2 hosts (WSL2, recent Linux): limits are per process and
# thread, and the worker container's own mem_limit / pids_limit are the overall ceiling (D-081).
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
ALLOW_ENABLE_NETWORK=false
ENABLE_NETWORK=false
MAX_MEMORY_LIMIT=8192000
MAX_CPU_TIME_LIMIT=15
MAX_CPU_EXTRA_TIME=5
MAX_WALL_TIME_LIMIT=30
MAX_MAX_PROCESSES_AND_OR_THREADS=256
COUNT=4
